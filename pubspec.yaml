name: motors_app
description: Motors App by Stylemix

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

#Version APP
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  #utils
  path_provider: ^2.1.5
  flutter_bloc: ^9.1.1
  image_picker: ^1.1.2
  flutter_html: ^3.0.0
  mime: ^2.0.0
  quiver: ^3.2.2
  logger: ^2.6.0
  json_annotation: ^4.9.0
  connectivity_plus: ^6.1.4
  youtube_player_iframe: ^5.2.1
  easy_localization: ^3.0.7+1
  flutter_inappwebview: ^6.1.5
  easy_localization_loader:
  
    git: https://github.com/aissat/easy_localization_loader.git

  #provider
  provider: ^6.1.5

  #local_storage
  shared_preferences: ^2.5.3

  #network
  dio: ^5.8.0+1
  http: ^1.4.0

  #location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  #ui
  cupertino_icons: ^1.0.8
  flutter_vector_icons: ^2.0.0
  font_awesome_flutter: ^10.8.0
  flutter_svg: ^2.2.0
  carousel_slider: ^5.1.1
  photo_view: ^0.15.0
  google_maps_flutter: ^2.12.3
  curl_logger_dio_interceptor: 
  smooth_page_indicator:
  webview_flutter: ^4.13.0

  url_launcher: ^6.3.1
  fluttertoast: ^8.2.12
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0

  
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.1

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/


  fonts:
    - family: IconsMotors
      fonts:
        - asset: assets/icons/IconsMotors.ttf

    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFProDisplay-Black.ttf
        - asset: assets/fonts/SFProDisplay-Bold.ttf
        - asset: assets/fonts/SFProDisplay-Light.ttf
        - asset: assets/fonts/SFProDisplay-Medium.ttf
        - asset: assets/fonts/SFProDisplay-Regular.ttf
        - asset: assets/fonts/SFProDisplay-Semibold.ttf
        - asset: assets/fonts/SFProDisplay-Thin.ttf

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages